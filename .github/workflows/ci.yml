name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt

      - name: Validate environment
        run: python -m pip check

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check core boundaries
        run: mypy

      - name: Test with branch coverage
        run: >-
          pytest -q --cov=src --cov-branch --cov-report=term-missing

  security-tools:
    name: Dependency and secret audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt

      - name: Audit declared and installed dependencies
        run: |
          pip-audit . --progress-spinner off
          pip-audit --local --progress-spinner off

      - name: Scan tracked files for secrets
        run: python scripts/check_secrets.py
